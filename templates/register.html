<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Nuevo Usuario</title>
    <style>
        /* --- Variables y Reset --- */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
            --border-focus: #4f46e5;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        /* --- Contenedor Principal (Tarjeta) --- */
        .register-card {
            background: var(--bg-card);
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- Alertas (Mensajes de Jinja2) --- */
        .alert {
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid;
        }

        .alert-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-text);
        }

        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-text);
        }

        /* --- Formulario --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select {
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        /* --- Campo de Contraseña con Toggle --- */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* --- Botón de Envío --- */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* --- Responsivo --- */
        @media (max-width: 600px) {
            .register-card {
                padding: 1.5rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <main class="register-card">
        <div class="card-header">
            <h1>Registro de Usuario</h1>
            <p>Por favor, complete los siguientes campos para crear una nueva cuenta.</p>
        </div>

        <!-- Mensajes de Feedback (Jinja2) -->
        {% if request.query_params.get('error') %}
            <div class="alert alert-error">
                {{ request.query_params.get('error') }}
            </div>
        {% endif %}
        
        {% if request.query_params.get('success') %}
            <div class="alert alert-success">
                {{ request.query_params.get('success') }}
            </div>
        {% endif %}

        <!-- Formulario -->
        <!-- Ajusta el 'action' a la ruta de tu backend -->
        <form action="/registro" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ej. juan.perez" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
                    <button type="button" class="toggle-password" onclick="togglePass()">Mostrar</button>
                </div>
            </div>

            <div class="form-group">
                <label for="rol">Tipo de Rol</label>
                <select id="rol" name="rol" required>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Registrar Usuario</button>
        </form>
    </main>

    <script>
        // Pequeño script para mostrar/ocultar contraseña
        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = 'Ocultar';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = 'Mostrar';
            }
        }
    </script>
</body>
</html>
